services:
  - type: web
    name: telegram-repost-bot
    env: python
    plan: free
    buildCommand: |
      apt-get update
      apt-get install -y ffmpeg python3-pip python3-pil
      pip install --upgrade pip
      pip install --no-cache-dir python-telegram-bot==20.7 moviepy==1.0.3 requests==2.31.0 numpy==1.26.0 ffmpeg-python==0.2.0
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SOURCE_CHANNEL_ID
        sync: false
      - key: TARGET_CHANNEL_ID
        sync: false
