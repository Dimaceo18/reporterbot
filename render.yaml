services:
  - type: worker
    name: reporterbot
    runtime: python
    buildCommand: |
      apt-get update
      apt-get install -y ffmpeg
      chmod +x render-build.sh
      ./render-build.sh
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SOURCE_CHANNEL_ID
        sync: false
      - key: TARGET_CHANNEL_ID
        sync: false
    plan: free
