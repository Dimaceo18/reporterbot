services:
  - type: worker
    name: reporterbot
    runtime: python
    buildCommand: |
      echo "🐍 Устанавливаем Python 3.10 через систему..."
      apt-get update
      apt-get install -y software-properties-common
      add-apt-repository ppa:deadsnakes/ppa -y
      apt-get update
      apt-get install -y python3.10 python3.10-venv python3.10-dev ffmpeg python3-pil python3-pil.imagetk
      ln -sf /usr/bin/python3.10 /usr/bin/python
      python --version
      
      echo "📦 Создаем виртуальное окружение..."
      python -m venv .venv
      source .venv/bin/activate
      
      echo "📦 Обновляем pip..."
      pip install --upgrade pip
      
      echo "📦 Устанавливаем Pillow через систему (без компиляции)..."
      pip install --no-cache-dir --only-binary :all: Pillow==9.5.0 || true
      
      echo "📦 Устанавливаем остальные зависимости..."
      pip install --no-cache-dir -r requirements.txt
      
      echo "✅ Build completed!"
    startCommand: |
      source .venv/bin/activate
      python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SOURCE_CHANNEL_ID
        sync: false
      - key: TARGET_CHANNEL_ID
        sync: false
    plan: free
